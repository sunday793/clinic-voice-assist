[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-gateway]
exten => 060,1,NoOp(Incoming call to clinic voice assistant)
 same => n,Answer()
 same => n,Set(CALL_UUID=${CHANNEL(uniqueid)})
 same => n,NoOp(Starting AudioSocket with CALL_UUID=${CALL_UUID})
 same => n,AudioSocket(${CALL_UUID},app:9092)
 same => n,NoOp(AudioSocket session finished)
 same => n,Hangup()
