[global]
type=global
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[vm-060-auth]
type=auth
auth_type=userpass
username=vm-060
password=${ENV(SIP_VM_PASSWORD)}

[vm-060-aor]
type=aor
contact=sip:10.250.0.6:5060
qualify_frequency=30

[vm-060]
type=endpoint
transport=transport-udp
context=from-gateway
disallow=all
allow=alaw
allow=ulaw
outbound_auth=vm-060-auth
aors=vm-060-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=vm-060
from_domain=10.250.0.6

[vm-060-identify]
type=identify
endpoint=vm-060
match=10.250.0.6

[vm-060-registration]
type=registration
transport=transport-udp
outbound_auth=vm-060-auth
server_uri=sip:10.250.0.6:5060
client_uri=sip:vm-060@10.250.0.6
contact_user=vm-060
retry_interval=30
expiration=300
